
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Street | Meu Carrinho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #080808;
            color: white;
            font-family: 'Inter', Arial, sans-serif;
        }

        .topo {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 25px;
        }

        .topo a {
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 18px;
        }

        .topo .ativo {
            border-color: #ff5722;
            color: #ff5722;
        }

        .carrinho {
            border: 1px solid #ff5722;
            border-radius: 12px;
            padding: 35px;
            min-height: 350px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            margin: 0 0 35px;
        }

        #itens {
            color: #aaa;
            font-size: 20px;
        }

        .produto {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            color: white;
        }

        .produto-info {
            flex: 1;
        }

        .produto-nome {
            font-weight: bold;
            font-size: 18px;
        }

        .produto-preco {
            color: #ff5722;
            margin-top: 8px;
        }

        .produto button {
            background: #ff5722;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
        }

        #total {
            font-size: 34px;
            font-weight: 700;
            margin: 30px 0;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .botoes button,
        .botoes a {
            display: inline-block;
            padding: 22px;
            border: 1px solid #444;
            border-radius: 9px;
            background: transparent;
            color: white;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
        }

        .botoes .finalizar {
            background: #ff5722;
            border-color: #ff5722;
            font-weight: bold;
        }

        .botoes button:hover,
        .botoes a:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .carrinho {
                padding: 20px;
            }

            .topo {
                flex-wrap: wrap;
            }

            .produto {
                flex-wrap: wrap;
            }

            #total {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <nav class="topo">
        <a href="carrinho.html" class="ativo">
            🛒 Carrinho (<span id="quantidade">0</span>)
        </a>

        <a href="index.html">← Voltar</a>
    </nav>

    <main class="carrinho">
        <h1>MEU CARRINHO</h1>

        <div id="itens">Seu carrinho está vazio.</div>

        <div id="total">Total: R$ 0,00</div>

        <div class="botoes">
            <button onclick="limparCarrinho()">Limpar carrinho</button>

            <a href="index.html">Continuar comprando</a>

            <button class="finalizar" onclick="finalizarCompra()">
                FINALIZAR COMPRA
            </button>
        </div>
    </main>

    <script>
        let carrinho = [];

        try {
            carrinho = JSON.parse(
                localStorage.getItem("carrinhoSoulStreet") || "[]"
            );

            if (!Array.isArray(carrinho)) {
                carrinho = [];
            }
        } catch {
            carrinho = [];
        }

        function dinheiro(valor) {
            return Number(valor).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
        }

        function salvar() {
            localStorage.setItem(
                "carrinhoSoulStreet",
                JSON.stringify(carrinho)
            );
            mostrarCarrinho();
        }

        function mostrarCarrinho() {
            const itens = document.getElementById("itens");
            const totalElemento = document.getElementById("total");

            document.getElementById("quantidade").textContent =
                carrinho.reduce(
                    (soma, produto) => soma + (Number(produto.quantidade) || 1),
                    0
                );

            if (carrinho.length === 0) {
                itens.textContent = "Seu carrinho está vazio.";
                totalElemento.textContent = "Total: R$ 0,00";
                return;
            }

            itens.innerHTML = "";
            let total = 0;

            carrinho.forEach((produto, indice) => {
                const quantidade = Number(produto.quantidade) || 1;
                const preco = Number(produto.preco) || 0;
                total += preco * quantidade;

                const linha = document.createElement("div");
                linha.className = "produto";

                const info = document.createElement("div");
                info.className = "produto-info";

                const nome = document.createElement("div");
                nome.className = "produto-nome";
                nome.textContent = produto.nome || "Produto";

                const valor = document.createElement("div");
                valor.className = "produto-preco";
                valor.textContent =
                    dinheiro(preco) + " × " + quantidade;

                info.append(nome, valor);

                const subtotal = document.createElement("strong");
                subtotal.textContent = dinheiro(preco * quantidade);

                const remover = document.createElement("button");
                remover.textContent = "Remover";
                remover.onclick = function () {
                    carrinho.splice(indice, 1);
                    salvar();
                };

                linha.append(info, subtotal, remover);
                itens.appendChild(linha);
            });

            totalElemento.textContent = "Total: " + dinheiro(total);
        }

        function limparCarrinho() {
            if (carrinho.length === 0) {
                alert("O carrinho já está vazio.");
                return;
            }

            if (confirm("Deseja remover todos os produtos?")) {
                carrinho = [];
                salvar();
            }
        }

        function finalizarCompra() {
            if (carrinho.length === 0) {
                alert("Adicione produtos ao carrinho antes de finalizar!");
                return;
            }

            window.location.href = "checkout.html";
        }

        mostrarCarrinho();
    </script>

</body>
</html>
