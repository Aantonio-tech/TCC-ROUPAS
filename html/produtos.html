<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Street | Produtos</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/produtos.css">
    
</head>
<body>
    <main class="container" style="padding-top: 60px;">
        <section class="section-head">
            <h2>Nossos Produtos</h2>
            <p>Explore a coleção completa da Soul Street.</p>
        </section>

        <section class="categorias">

            <div class="categoria" onclick="abrirCategoria('camisas')">
        
                <h2>Camisas</h2>
        
                <p>
                    Modelagens oversized e estampas exclusivas
                    inspiradas na cultura urbana.
                </p>
        
            </div>
        
        
            <div class="categoria" onclick="abrirCategoria('calcas')">
        
                <h2>Calças</h2>
        
                <p>
                    Estilo cargo e moletom premium para o máximo
                    de conforto e atitude.
                </p>
        
            </div>
        
        
            <div class="categoria" onclick="abrirCategoria('tenis')">
        
                <h2>Tênis</h2>
        
                <p>
                    Design moderno e resistência para acompanhar
                    o ritmo das ruas.
                </p>
        
            </div>
        
        </section>
    </main>
</body>
</html>
